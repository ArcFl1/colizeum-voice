<html lang="ru"><head>

<title>Голос из Colizeum · Яркая, 40</title>

<style>
  /* Страница для друга из дома: открывается по ссылке из голосовой комнаты клуба */
  @font-face { font-family: "Inter"; src: url("InterVariable.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
  :root {
    --bg: #0A0B0D; --plate: #121417; --plate-2: #171A1E; --plate-3: #1E2228; --plate-4: #262B32; --line: #2A2F36;
    --text: #F2F4F7; --muted: #B3B9C3; --dim: #8C929D;
    --xp: #FFC400; --xp-hi: #FFD647; --xp-soft: rgba(255, 196, 0, .10); --xp-edge: rgba(255, 196, 0, .32);
    --blue: #4FB3F0; --ok: #46E07A; --bad: #FF5A5A;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
    font: 16px/1.5 "Inter", "Segoe UI", Roboto, system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  body { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column;
    background:
      radial-gradient(60vmax 50vmax at -10% -10%, rgba(255, 196, 0, .10), transparent 60%),
      radial-gradient(60vmax 50vmax at 110% 110%, rgba(79, 179, 240, .10), transparent 60%),
      var(--bg); }
  /* Как в приложении клуба во время Хэллоуина (20.10–02.11): фиолетовая мгла, тыквенный акцент */
  body.hw {
    --xp: #FF8A2A; --xp-hi: #FFB061; --xp-soft: rgba(255, 138, 42, .12); --xp-edge: rgba(255, 138, 42, .38);
    --bg: #0B0810; --plate: #140F1B; --plate-2: #1B1424; --plate-3: #241B30; --plate-4: #2E2340; --line: #3A2D4D; --blue: #8F5BFF;
    background:
      radial-gradient(1100px 560px at 88% -8%, rgba(143, 91, 255, .30), transparent 60%),
      radial-gradient(900px 520px at -5% 105%, rgba(255, 106, 0, .14), transparent 60%),
      radial-gradient(700px 400px at 30% 40%, rgba(110, 60, 200, .12), transparent 70%),
      var(--bg) fixed;
  }
  body.hw .card { background: linear-gradient(180deg, rgba(40, 28, 60, .92), rgba(22, 16, 32, .92)); box-shadow: 0 20px 60px rgba(60, 20, 120, .25); }
  body.hw .brand b { background: linear-gradient(90deg, #FFFFFF 0%, #FFC28A 100%); -webkit-background-clip: text; background-clip: text; }
  .fog { position: fixed; left: -10%; right: -10%; bottom: -40px; height: 240px; z-index: -1; pointer-events: none; display: none;
    background:
      radial-gradient(40% 60% at 20% 80%, rgba(143, 91, 255, .18), transparent 70%),
      radial-gradient(35% 55% at 60% 90%, rgba(180, 160, 220, .10), transparent 70%),
      radial-gradient(40% 60% at 90% 80%, rgba(255, 138, 42, .12), transparent 70%);
    filter: blur(8px); animation: fog 26s ease-in-out infinite alternate; }
  body.hw .fog { display: block; }
  @keyframes fog { to { transform: translateX(6%); } }
  .wrap { width: 100%; max-width: 460px; margin: 0 auto; flex: 1; display: flex; flex-direction: column;
    padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  body.in-room .wrap { max-width: 1040px; }

  /* Шапка: знак клуба и название */
  .top { display: flex; align-items: center; gap: 12px; }

  a.club:hover .map-go, a.club:focus-visible .map-go { opacity: 1; }
  .addr i { display: inline-block; width: 3px; height: 3px; border-radius: 50%; background: var(--xp); margin: 0 7px; vertical-align: middle; }
  /* Узкий экран: от «в эфире» остаётся точка, чтобы адрес не теснился */
  @media (max-width: 440px) { .live { padding: 8px; font-size: 0; gap: 0; } }
  .live { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border: 1px solid var(--line);
    font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
  .live i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px var(--ok); animation: blink 1.6s infinite; }

  main { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 16px; padding: 28px 0 20px; }
  body.in-room main { justify-content: flex-start; padding-top: 20px; }
  .grid { display: grid; gap: 16px; }
  @media (min-width: 860px) {
    .grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); align-items: start; }
  }

  /* Карточка с уголками, как рамка на логотипе */
  .card { position: relative; padding: 22px 20px; background: linear-gradient(180deg, var(--plate-2), var(--plate)); border: 1px solid var(--line); }
  .card::before, .card::after { content: ""; position: absolute; width: 22px; height: 22px; pointer-events: none; }
  .card::before { top: -1px; left: -1px; border-top: 2px solid var(--xp); border-left: 2px solid var(--xp); }
  .card::after { bottom: -1px; right: -1px; border-bottom: 2px solid var(--blue); border-right: 2px solid var(--blue); }

  .kicker { font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--xp); }
  h1 { margin: 6px 0 0; font-size: 28px; line-height: 1.15; font-weight: 800; letter-spacing: -.01em; }
  h2 { margin: 0; font-size: 17px; font-weight: 800; }
  p { margin: 0; color: var(--muted); }

  /* Приглашение: кто зовёт */
  .inviter { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
  .ring { position: relative; width: 64px; height: 64px; flex: none; }
  .ring::before, .ring::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--xp-edge); animation: wave 2.4s ease-out infinite; }
  .ring::after { animation-delay: 1.2s; }
  .av { width: 100%; height: 100%; border-radius: 50%; display: grid; place-items: center; position: relative; z-index: 1;
    font-weight: 800; font-size: 24px; color: #111; background: linear-gradient(135deg, var(--xp-hi), var(--xp)); }
  .chip { display: inline-flex; align-items: center; gap: 8px; margin-top: 14px; padding: 8px 12px; background: var(--plate-3); border: 1px solid var(--line); font-size: 14px; color: var(--muted); }
  .chip b { color: var(--text); }

  /* Кнопки */
  button, select, input { font: inherit; color: inherit; }
  button { font-weight: 800; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--xp); outline-offset: 2px; }
  button:disabled { opacity: .55; cursor: default; }
  .go { width: 100%; margin-top: 20px; padding: 17px 18px; display: flex; align-items: center; justify-content: center; gap: 10px;
    color: #111; background: linear-gradient(180deg, var(--xp-hi), var(--xp)); font-size: 17px; letter-spacing: .02em;
    box-shadow: 0 10px 30px rgba(255, 196, 0, .18); transition: transform .12s, box-shadow .12s; }
  .go:active { transform: translateY(1px); box-shadow: 0 4px 14px rgba(255, 196, 0, .18); }
  .go svg { width: 20px; height: 20px; }
  .note { margin-top: 12px; font-size: 13px; color: var(--dim); text-align: center; }
  .err { color: var(--bad); }

  /* Разговор: люди в комнате */
  .head-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .head-row h1 { font-size: 24px; }
  .timer { font-variant-numeric: tabular-nums; color: var(--dim); font-size: 14px; }
  .people { display: grid; gap: 8px; margin: 16px 0 0; padding: 0; list-style: none; }
  .people li { display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: var(--plate-3); border: 1px solid transparent; transition: border-color .2s, background .2s; }
  .people li.on { border-color: rgba(70, 224, 122, .45); background: rgba(70, 224, 122, .06); }
  .pav { width: 38px; height: 38px; flex: none; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 15px;
    color: var(--text); background: #2B3038; box-shadow: 0 0 0 2px transparent; transition: box-shadow .2s; }
  .pav.club { background: linear-gradient(135deg, #2E3B4D, #1F2733); color: #CFE6FA; }

  li.on .pav { box-shadow: 0 0 0 2px var(--ok), 0 0 14px rgba(70, 224, 122, .5); }
  .pname { flex: 1; min-width: 0; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ptag { font-size: 12px; color: var(--dim); white-space: nowrap; }
  .ptag.club { color: #9FCBEF; }
  .ptag.off { color: var(--bad); }
  .bars { display: inline-flex; gap: 2px; align-items: flex-end; height: 14px; margin-left: 6px; }
  .bars i { width: 3px; background: var(--ok); border-radius: 1px; animation: bar .8s ease-in-out infinite; }
  .bars i:nth-child(2) { animation-delay: .15s; } .bars i:nth-child(3) { animation-delay: .3s; }

  .ptt { width: 100%; margin-top: 16px; padding: 18px; background: var(--plate-3); border: 1px dashed var(--xp-edge); color: var(--muted); font-size: 15px; user-select: none; -webkit-user-select: none; touch-action: none; }
  .ptt.down { background: rgba(70, 224, 122, .12); border: 1px solid var(--ok); color: var(--text); }

  .controls { display: flex; justify-content: center; gap: 22px; margin-top: 20px; }
  .ctl { position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--muted); background: none; padding: 0; }
  .ctl .c { width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center; background: var(--plate-3); border: 1px solid var(--line); color: var(--text); transition: background .15s; }
  .ctl .c svg { width: 25px; height: 25px; }
  .ctl.off .c { background: rgba(255, 90, 90, .14); border-color: rgba(255, 90, 90, .5); color: var(--bad); }
  .ctl.leave .c { background: var(--bad); border-color: var(--bad); color: #fff; }

  /* Чат */
  .chat-card { display: flex; flex-direction: column; padding-bottom: 14px; }
  .chat-head { display: flex; align-items: center; gap: 10px; }
  .chat-head small { display: block; color: var(--dim); font-size: 12px; font-weight: 500; }
  .bell { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; background: var(--plate-3); border: 1px solid var(--line); font-size: 12px; font-weight: 700; color: var(--muted); }
  .bell.on { color: var(--xp); border-color: var(--xp-edge); }
  .bell svg { width: 15px; height: 15px; }
  .chat-list { margin-top: 12px; height: 340px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; padding: 4px 2px; overscroll-behavior: contain; }
  @media (min-width: 860px) { .chat-list { height: min(60vh, 520px); } }
  .chat-empty { margin: auto; text-align: center; color: var(--dim); font-size: 14px; padding: 20px; }
  .msg { display: flex; gap: 10px; padding: 6px 4px; }
  .msg.cont { padding-top: 0; }
  .msg .mav { width: 32px; height: 32px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 800; color: #111; }
  .msg.cont .mav { visibility: hidden; height: 0; }
  .mbody { min-width: 0; flex: 1; }
  .mmeta { display: flex; align-items: baseline; gap: 8px; }
  .mmeta b { font-size: 14px; }
  .msg.mine .mmeta b { color: var(--xp); }
  .mfrom { font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: #9FCBEF; padding: 0 5px; border: 1px solid rgba(79, 179, 240, .35); }
  .mtime { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .mtext { color: var(--text); word-wrap: break-word; overflow-wrap: anywhere; white-space: pre-wrap; }

  .msg.pending .mtext { opacity: .55; }
  .msg .merr { font-size: 12px; color: var(--bad); }
  .msg .merr button { background: none; color: var(--xp); padding: 0; font-weight: 700; text-decoration: underline; }
  .chat-form { display: flex; gap: 8px; margin-top: 12px; }
  .chat-form input { flex: 1; min-width: 0; padding: 12px 14px; background: var(--plate-3); border: 1px solid var(--line); outline: none; }
  .chat-form input:focus { border-color: var(--xp-edge); }
  .chat-form button { flex: none; width: 48px; display: grid; place-items: center; color: #111; background: var(--xp); }
  .chat-form button svg { width: 20px; height: 20px; }
  .chat-form .tool { width: 44px; color: var(--muted); background: var(--plate-3); border: 1px solid var(--line); }
  .chat-form .tool.on, .chat-form .tool:hover { color: var(--xp); border-color: var(--xp-edge); }
  .chat-form .tool:disabled { opacity: .5; }
  .chat-wrap { position: relative; }
  .emoji { position: absolute; left: 0; right: 0; bottom: calc(100% + 8px); z-index: 5; padding: 10px; background: var(--plate-2); border: 1px solid var(--line); box-shadow: 0 12px 30px rgba(0,0,0,.4); }
  .emoji-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
  .emoji-grid button { padding: 6px 0; font-size: 22px; line-height: 1; background: none; border-radius: 6px; font-weight: 700; color: var(--text); }
  .emoji-grid button:hover { background: var(--plate-4); }
  .mphoto { display: block; margin-top: 4px; padding: 0; border: 1px solid var(--line); background: var(--plate-3); cursor: zoom-in; max-width: 100%; }
  .mphoto img { display: block; max-width: min(280px, 100%); max-height: 260px; }
  .mphoto.wait { padding: 26px 18px; font-size: 13px; color: var(--dim); cursor: default; }
  .mmeta b[data-name] { cursor: pointer; }
  .mmeta b[data-name]:hover { text-decoration: underline; }
  .mtext .at { color: var(--xp); font-weight: 700; }
  .msg.atme { background: var(--xp-soft); box-shadow: inset 3px 0 0 var(--xp); }
  .people li[data-name] { cursor: pointer; }
  .chat-card.drop { outline: 2px dashed var(--xp); outline-offset: -6px; }
  .lightbox { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(0, 0, 0, .88); cursor: zoom-out; }
  .lightbox img { max-width: 94vw; max-height: 88vh; }

  /* Настройки — выезжающая панель */
  .sheet-bg { position: fixed; inset: 0; z-index: 10; background: rgba(0, 0, 0, .6); display: flex; align-items: flex-end; justify-content: center; }
  @media (min-width: 860px) { .sheet-bg { align-items: center; } }
  .sheet { width: 100%; max-width: 520px; max-height: 92vh; overflow-y: auto; background: var(--plate); border: 1px solid var(--line); border-top: 2px solid var(--xp);
    padding: 20px 20px max(20px, env(safe-area-inset-bottom)); animation: up .2s ease-out; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .x { width: 38px; height: 38px; background: var(--plate-3); border: 1px solid var(--line); color: var(--muted); font-size: 20px; line-height: 1; }
  .set { padding: 14px 0; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
  .set:last-of-type { border-bottom: 0; }
  .set > label, .set > .lbl { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .02em; }
  .set select { width: 100%; padding: 11px 12px; background: var(--plate-3); border: 1px solid var(--line); }
  .meter { height: 10px; background: var(--plate-3); border: 1px solid var(--line); overflow: hidden; }
  .meter i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--ok), var(--xp)); transition: width .06s linear; }
  .hint { font-size: 12px; color: var(--dim); }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .seg button { padding: 11px 10px; background: var(--plate-3); border: 1px solid var(--line); font-size: 14px; font-weight: 700; color: var(--muted); }
  .seg button.on { color: #111; background: var(--xp); border-color: var(--xp); }
  .tog { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 0; font-size: 15px; color: var(--text); cursor: pointer; }
  .tog input { appearance: none; -webkit-appearance: none; flex: none; width: 44px; height: 26px; border-radius: 13px; background: var(--plate-4); position: relative; cursor: pointer; transition: background .15s; }
  .tog input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .tog input:checked { background: var(--ok); }
  .tog input:checked::after { transform: translateX(18px); }
  .vol { display: grid; grid-template-columns: minmax(0, 1fr) 1.4fr 44px; gap: 10px; align-items: center; font-size: 14px; }
  .vol span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vol output { text-align: right; color: var(--dim); font-variant-numeric: tabular-nums; font-size: 13px; }
  input[type=range] { width: 100%; accent-color: var(--xp); }
  .done { width: 100%; margin-top: 14px; padding: 14px; color: #111; background: var(--xp); }

  /* Экраны «закрылась», «устарела» */
  .big-ico { width: 56px; height: 56px; display: grid; place-items: center; margin-bottom: 14px; border: 1px solid var(--line); background: var(--plate-3); color: var(--xp); }
  .big-ico svg { width: 28px; height: 28px; }

  /* Приписка клуба */

  @keyframes wave { 0% { transform: scale(1); opacity: .9; } 100% { transform: scale(1.55); opacity: 0; } }
  @keyframes blink { 50% { opacity: .35; } }
  @keyframes bar { 0%, 100% { height: 4px; } 50% { height: 14px; } }
  @keyframes up { from { transform: translateY(24px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

    try { m = JSON.parse(new TextDecoder().decode(payload)); } catch (e) { return; }
    if (!m) return;
    if (m.t === 'msg' && Array.isArray(m.list)) {
      var fresh = m.list.filter(function (x) { return !chat.some(function (y) { return y.id === x.id; }); });
      if (!fresh.length) return;
      fresh.forEach(function (x) {
        if (x.nonce && pending[x.nonce]) { mine[x.nonce] = true; if (pending[x.nonce].photoUrl) photos[x.id] = pending[x.nonce].photoUrl; delete pending[x.nonce]; }
      });
      chat = chat.concat(fresh).sort(function (a, b) { return a.id - b.id; }).slice(-150);
      var others = fresh.filter(function (x) { return !(x.nonce && mine[x.nonce]); });
      if (!m.history && others.length) ping(others.some(atMe));
      renderChat();
    } else if (m.t === 'gone' && Array.isArray(m.ids)) {
      chat = chat.filter(function (x) { return m.ids.indexOf(x.id) < 0; });
      renderChat();
    } else if (m.t === 'err' && m.nonce && pending[m.nonce]) {
      pending[m.nonce].error = 'Не отправлено: ' + String(m.error || '').replace(/^Не отправлено:\s*/, '');
      renderChat();
    }
  }
  function sendData(obj, to) {
    if (!room) return;
    var data = new TextEncoder().encode(JSON.stringify(obj));
    room.localParticipant.publishData(data, { reliable: true, topic: TOPIC, destinationIdentities: to }).catch(function () {});
  }
  function sendChat(raw) {
    var text = String(raw || '').replace(/\s+/g, ' ').trim();
    if (!text || !room) return;
    $('chat-in').value = '';
    var nonce = Math.random().toString(36).slice(2) + Date.now().toString(36);
    pending[nonce] = { text: text, at: Math.floor(Date.now() / 1000) };
    mine[nonce] = true;
    var club = clubIds();
    if (!club.length) {
      pending[nonce].error = 'В клубе сейчас никого — сообщение не дойдёт';
      pending[nonce].retry = true;
    } else {
      sendData({ t: 'say', nonce: nonce, text: text }, club);
      setTimeout(function () {
        if (pending[nonce] && !pending[nonce].error) { pending[nonce].error = 'Не дошло'; pending[nonce].retry = true; renderChat(); }
      }, 9000);
    }
    renderChat();
  }

  // ── Фото ──────────────────────────────────────────────────────────────────
  // Ужимаем здесь же: до 1280 px, JPEG — фото с телефона уходит за секунду
  function shrink(file) {
    return new Promise(function (resolve, reject) {
      if (!/^image\//.test(file.type)) return reject(new Error('Можно отправить только фото'));
      var u = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        URL.revokeObjectURL(u);
        var k = Math.min(1, 1280 / Math.max(img.naturalWidth, img.naturalHeight));
        var c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.naturalWidth * k)); c.height = Math.max(1, Math.round(img.naturalHeight * k));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        var q = 0.82;
        var go = function () {
          c.toBlob(function (b) {
            if (!b) return reject(new Error('Не получилось ужать фото'));
            if (b.size > 650000 && q > 0.4) { q -= 0.12; go(); } else resolve(b);
          }, 'image/jpeg', q);
        };
        go();
      };
      img.onerror = function () { URL.revokeObjectURL(u); reject(new Error('Не получилось открыть фото')); };
      img.src = u;
    });
  }
  function sendPhoto(file) {
    if (!room) return;
    var nonce = Math.random().toString(36).slice(2) + Date.now().toString(36);
    var btn = $('photo-btn'); if (btn) btn.disabled = true;
    shrink(file).then(function (blob) {
      pending[nonce] = { photoUrl: URL.createObjectURL(blob), blob: blob, at: Math.floor(Date.now() / 1000) };
      mine[nonce] = true;
      renderChat();
      var club = clubIds();
      if (!club.length) { pending[nonce].error = 'В клубе сейчас никого — фото не дойдёт'; pending[nonce].retry = true; renderChat(); return; }
      return blob.arrayBuffer().then(function (buf) {
        return room.localParticipant.streamBytes({ name: 'photo.jpg', mimeType: 'image/jpeg', topic: PHOTO_UP, totalSize: buf.byteLength, destinationIdentities: club, attributes: { nonce: nonce } });
      }).then(function (w) { return blob.arrayBuffer().then(function (buf) { return w.write(new Uint8Array(buf)).then(function () { return w.close(); }); }); })
        .then(function () {
          setTimeout(function () { if (pending[nonce] && !pending[nonce].error) { pending[nonce].error = 'Не дошло'; pending[nonce].retry = true; renderChat(); } }, 20000);
        });
    }).catch(function (err) {
      if (pending[nonce]) { pending[nonce].error = 'Не отправлено: ' + (err.message || err); pending[nonce].retry = true; renderChat(); }
      else alert(err.message || err);
    }).then(function () { if (btn) btn.disabled = false; });
  }
  function openPhoto(src) {
    var box = document.createElement('div');
    box.className = 'lightbox';
    box.innerHTML = '<img src="' + esc(src) + '" alt="">';
    box.onclick = function () { box.remove(); };
    document.body.appendChild(box);
  }

  // ── Настройки ─────────────────────────────────────────────────────────────
  function openSettings() {
    var bg = document.createElement('div');
    bg.className = 'sheet-bg';
    bg.innerHTML = '<div class="sheet" role="dialog" aria-label="Настройки голоса">'
      + '<div class="sheet-head"><h2>Настройки голоса</h2><button class="x" id="sx" aria-label="Закрыть">×</button></div>'
      + '<div class="set"><label for="s-in">Микрофон</label><select id="s-in"></select>'
      + '<div class="meter"><i id="s-lvl"></i></div><span class="hint">Скажи что-нибудь — полоска должна двигаться</span></div>'
      + '<div class="set" id="s-out-box"><label for="s-out">Звук (наушники или колонки)</label><select id="s-out"></select></div>'
      + '<div class="set"><span class="lbl">Как говорить</span><div class="seg"><button id="s-open">Открытый микрофон</button><button id="s-ptt">Рация</button></div>'
      + '<span class="hint" id="s-mode-hint"></span></div>'
      + '<div class="set"><span class="lbl">Обработка голоса</span>'
      + '<label class="tog">Шумоподавление<input type="checkbox" id="s-ns"></label>'
      + '<label class="tog">Подавление эха (если без наушников)<input type="checkbox" id="s-ec"></label>'
      + '<label class="tog">Автогромкость микрофона<input type="checkbox" id="s-agc"></label></div>'
      + '<div class="set"><span class="lbl">Громкость собеседников</span><div id="s-vols"></div></div>'
      + '<button class="done" id="sdone">Готово</button></div>';
    document.body.appendChild(bg);
    var close = function () { stopMeter(); bg.remove(); render(); };
    bg.onclick = function (e) { if (e.target === bg) close(); };
    $('sx').onclick = close; $('sdone').onclick = close;

    // Устройства
    LK.Room.getLocalDevices('audioinput').then(function (list) {
      $('s-in').innerHTML = list.map(function (d, i) { return '<option value="' + esc(d.deviceId) + '">' + esc(d.label || ('Микрофон ' + (i + 1))) + '</option>'; }).join('');
      var cur = room && room.getActiveDevice('audioinput');
      $('s-in').value = prefs.input || cur || (list[0] && list[0].deviceId) || '';
    }).catch(function () {});
    var canOut = 'setSinkId' in HTMLMediaElement.prototype;
    $('s-out-box').hidden = !canOut;
    if (canOut) {
      LK.Room.getLocalDevices('audiooutput').then(function (list) {
        $('s-out').innerHTML = list.map(function (d, i) { return '<option value="' + esc(d.deviceId) + '">' + esc(d.label || ('Устройство ' + (i + 1))) + '</option>'; }).join('');
        $('s-out').value = prefs.output || (room && room.getActiveDevice('audiooutput')) || 'default';
      }).catch(function () {});
    }
    $('s-in').onchange = function () { prefs.input = this.value; savePrefs(); restartMic(); };
    $('s-out').onchange = function () { prefs.output = this.value; savePrefs(); if (room) room.switchActiveDevice('audiooutput', prefs.output).catch(function () {}); };

    // Режим
    var mode = function () {
      $('s-open').className = prefs.mode === 'open' ? 'on' : '';
      $('s-ptt').className = prefs.mode === 'ptt' ? 'on' : '';
      $('s-mode-hint').textContent = prefs.mode === 'open' ? 'Тебя слышно всегда, пока микрофон включён'
        : 'Тебя слышно, только пока держишь кнопку «Удерживай, чтобы говорить»' + (matchMedia('(pointer: coarse)').matches ? '' : ' или пробел');
    };
    $('s-open').onclick = function () { prefs.mode = 'open'; savePrefs(); mode(); applyTalk(); };
    $('s-ptt').onclick = function () { prefs.mode = 'ptt'; savePrefs(); mode(); applyTalk(); };
    mode();

    // Обработка
    [['s-ns', 'ns'], ['s-ec', 'ec'], ['s-agc', 'agc']].forEach(function (x) {
      $(x[0]).checked = prefs[x[1]];
      $(x[0]).onchange = function () { prefs[x[1]] = this.checked; savePrefs(); restartMic(); };
    });

    // Громкость каждого
    var vols = [];
    room.remoteParticipants.forEach(function (p) { vols.push(p); });
    $('s-vols').innerHTML = vols.length ? vols.map(function (p) {
      var v = prefs.vol[p.identity] != null ? prefs.vol[p.identity] : 100;
      return '<div class="vol"><span>' + esc(p.name || 'Игрок') + '</span><input type="range" min="0" max="100" step="5" value="' + v + '" data-vol="' + esc(p.identity) + '"><output>' + v + '%</output></div>';
    }).join('') : '<span class="hint">Пока в комнате никого, кроме тебя</span>';
    $('s-vols').querySelectorAll('[data-vol]').forEach(function (r) {
      r.oninput = function () {
        prefs.vol[r.dataset.vol] = Number(r.value); savePrefs();
        r.nextElementSibling.textContent = r.value + '%';
        var p = room.remoteParticipants.get(r.dataset.vol);
        if (p) p.setVolume(Number(r.value) / 100);
      };
    });
    startMeter();
  }

  function restartMic() {
    var t = micTrack();
    if (t) t.restartTrack(captureOpts()).then(function () { applyTalk(); startMeter(); }).catch(function () {});
  }

  // Полоска громкости своего микрофона (то, что слышат другие)
  function startMeter() {
    stopMeter();
    var t = micTrack();
    if (!t || !t.mediaStreamTrack) return;
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      var an = ctx.createAnalyser(); an.fftSize = 512;
      ctx.createMediaStreamSource(new MediaStream([t.mediaStreamTrack])).connect(an);
      var buf = new Uint8Array(an.fftSize);
      var raf = 0;
      var loop = function () {
        an.getByteTimeDomainData(buf);
        var peak = 0;
        for (var i = 0; i < buf.length; i++) peak = Math.max(peak, Math.abs(buf[i] - 128));
        var el = $('s-lvl');
        if (el) el.style.width = Math.min(100, Math.round(peak / 128 * 160)) + '%';
        raf = requestAnimationFrame(loop);
      };
      loop();
      meter = { stop: function () { cancelAnimationFrame(raf); ctx.close(); } };
    } catch (e) { meter = null; }
  }
  function stopMeter() { if (meter) { meter.stop(); meter = null; } }

  // Рация на компьютере — пробел (когда не пишешь в чат)
  var typingField = function (e) { return e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName); };
  document.addEventListener('keydown', function (e) {
    if (e.code !== 'Space' || e.repeat || prefs.mode !== 'ptt' || !room || typingField(e)) return;
    e.preventDefault(); holding = true; if ($('ptt')) $('ptt').classList.add('down'); applyTalk();
  });
  document.addEventListener('keyup', function (e) {
    if (e.code !== 'Space' || !holding) return;
    holding = false; if ($('ptt')) $('ptt').classList.remove('down'); applyTalk();
  });

  // ── Подключение ───────────────────────────────────────────────────────────
  function join() {
    var btn = $('go');
    var msg = $('msg');
    btn.disabled = true;
    msg.className = 'note';
    msg.textContent = 'Подключаемся…';
    room = new LK.Room({ adaptiveStream: true, dynacast: true, audioCaptureDefaults: captureOpts(),
      audioOutput: prefs.output ? { deviceId: prefs.output } : undefined });
    room.on(LK.RoomEvent.TrackSubscribed, function (track, pub, p) {
      if (track.kind !== 'audio') return;
      $('audio').appendChild(track.attach());
      if (prefs.vol[p.identity] != null) p.setVolume(prefs.vol[p.identity] / 100);
    });
    room.on(LK.RoomEvent.TrackUnsubscribed, function (track) { track.detach().forEach(function (el) { el.remove(); }); });
    [LK.RoomEvent.ParticipantConnected, LK.RoomEvent.ParticipantDisconnected, LK.RoomEvent.ActiveSpeakersChanged, LK.RoomEvent.TrackMuted, LK.RoomEvent.TrackUnmuted]
      .forEach(function (ev) { room.on(ev, render); });
    // Пришёл ПК из клуба — попросим переписку (если её ещё нет)
    room.on(LK.RoomEvent.ParticipantConnected, function (p) {
      if (kindOf(p) !== 'club') return;
      clearTimeout(alone);
      if (!chat.length) sendData({ t: 'hello' }, [p.identity]);
    });
    // Из клуба в комнате никого — без клуба комнаты нет: подождём (вдруг связь моргнула) и закроем
    room.on(LK.RoomEvent.ParticipantDisconnected, function () { if (!clubIds().length) closeIfAlone(15000); });
    room.on(LK.RoomEvent.DataReceived, onData);
    // Фото из чата комнаты — отдельным потоком от ПК клуба
    room.registerByteStreamHandler(PHOTO, function (reader, from) {
      var p = room && room.remoteParticipants.get(from.identity);
      reader.readAll().then(function (chunks) {
        if (!p || kindOf(p) !== 'club') return;
        var id = Number((reader.info.attributes || {}).id);
        if (!id || photos[id]) return;
        photos[id] = URL.createObjectURL(new Blob(chunks, { type: reader.info.mimeType || 'image/jpeg' }));
        renderChat();
      }).catch(function () {});
    });
    room.on(LK.RoomEvent.Disconnected, function (reason) {
      clearInterval(timer);
      stopMeter();
      var sheet = document.querySelector('.sheet-bg');
      if (sheet) sheet.remove();
      clearTimeout(alone);
      var closed = reason === LK.DisconnectReason.ROOM_DELETED || closedByClub;
      if (closed) { try { localStorage.setItem(closedKey, '1'); } catch (e) { /* без памяти */ } }
      room = null;
      chat = []; pending = {};
      if (closed) message(ICO.bell, 'Голосовой чат клуба', 'Комната закрылась', 'В клубе все вышли из комнаты. Заходи к нам сам — поиграем вместе!');
      else {
        message(ICO.leave, 'Голосовой чат клуба', 'Ты вышел из голоса', 'Чтобы вернуться, открой ссылку ещё раз — она работает 3 часа.');
        app.querySelector('.card').insertAdjacentHTML('beforeend', '<button class="go" id="again">' + ICO.mic + 'Вернуться в голос</button>');
        $('again').onclick = function () { start(); };
      }
    });
    room.connect(url, token)
      .then(function () { return room.localParticipant.setMicrophoneEnabled(true, captureOpts()); })
      .then(function () { return room.startAudio(); })
      .then(function () {
        joinedAt = Date.now();
        timer = setInterval(function () { var c = $('clock'); if (c) c.textContent = clock(); }, 1000);
        layout();
        applyTalk();
        var club = clubIds();
        if (club.length) sendData({ t: 'hello' }, club);
        else closeIfAlone(8000);
      })
      .catch(function (err) {
        btn.disabled = false;
        var text = String(err && err.message || err);
        msg.className = 'note err';
        msg.textContent = /Permission|NotAllowed/i.test(text) ? 'Браузер не дал микрофон. Разреши доступ к микрофону и нажми ещё раз.'
          : /401|token|expired/i.test(text) ? 'Ссылка устарела или комната уже закрыта. Попроси новую.'
            : 'Не получилось подключиться: ' + text;
      });
  }

  start();
};
</script>
</body></html>
